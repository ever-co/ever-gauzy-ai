name: Deploy to DigitalOcean Dev

on:
    workflow_run:
        workflows: ['Build and Publish Docker Images Dev']
        branches: [develop]
        types:
            - completed

concurrency:
    group: ${{ github.ref }}-${{ github.workflow }}
    cancel-in-progress: true

jobs:
    deploy-dev:
        runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
        if: ${{ vars.DO_ENABLED == 'true' }}

        environment: prod

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install doctl
              uses: digitalocean/action-doctl@v2
              with:
                  token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

            - name: Log in to DigitalOcean Container Registry with short-lived credentials
              run: doctl registry login --expiry-seconds 600

            - name: Save DigitalOcean kubeconfig with short-lived credentials
              run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 k8s-gauzy

            - name: Generate TLS Secrets
              run: |
                  for host in apidev.gauzy.ai authdev.gauzy.ai; do
                      crt="${HOME}/${host}.crt"
                      key="${HOME}/${host}.key"
                      rm -f "${crt}" "${key}"
                      echo "${{ secrets.INGRESS_CERT }}" | base64 --decode > "${crt}"
                      echo "${{ secrets.INGRESS_CERT_KEY }}" | base64 --decode > "${key}"
                      kubectl create secret tls "${host}-tls" --save-config --dry-run=client --cert="${crt}" --key="${key}" -o yaml | kubectl --context do-sfo2-k8s-gauzy apply -f -
                  done

            - name: Apply k8s manifests changes in DigitalOcean k8s cluster (if any)
              run: |
                  envsubst < $GITHUB_WORKSPACE/.deploy/k8s/k8s-manifest.dev.yaml | kubectl --context do-sfo2-k8s-gauzy apply -f -
              env:
                  CLOUD_PROVIDER: 'DO'
                  DB_TYPE: '${{ secrets.DB_TYPE }}'
                  DB_URI: '${{ secrets.DB_URI }}'
                  DB_HOST: '${{ secrets.DB_HOST }}'
                  DB_USER: '${{ secrets.DB_USER }}'
                  DB_PASS: '${{ secrets.DB_PASS }}'
                  DB_NAME: '${{ secrets.DB_NAME }}'
                  DB_PORT: '${{ secrets.DB_PORT }}'
                  DB_CA_CERT: '${{ secrets.DB_CA_CERT }}'
                  DB_SSL_MODE: '${{ secrets.DB_SSL_MODE }}'
                  SENTRY_DSN: '${{ secrets.SENTRY_DSN }}'
                  SENTRY_TRACES_SAMPLE_RATE: '${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}'
                  SENTRY_HTTP_TRACING_ENABLED: '${{ secrets.SENTRY_HTTP_TRACING_ENABLED }}'
                  SENTRY_POSTGRES_TRACKING_ENABLED: '${{ secrets.SENTRY_POSTGRES_TRACKING_ENABLED }}'
                  JITSU_SERVER_URL: '${{ secrets.JITSU_SERVER_URL }}'
                  JITSU_SERVER_WRITE_KEY: '${{ secrets.JITSU_SERVER_WRITE_KEY }}'
                  OTEL_ENABLED: '${{ secrets.OTEL_ENABLED }}'
                  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: '${{ secrets.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}'
                  OTEL_EXPORTER_OTLP_HEADERS: '${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}'
                  AWS_ACCESS_KEY_ID: '${{ secrets.AWS_ACCESS_KEY_ID }}'
                  AWS_SECRET_ACCESS_KEY: '${{ secrets.AWS_SECRET_ACCESS_KEY }}'
                  AWS_REGION: '${{ secrets.AWS_REGION }}'
                  AWS_S3_BUCKET: '${{ secrets.AWS_S3_BUCKET }}'
                  WASABI_ACCESS_KEY_ID: '${{ secrets.WASABI_ACCESS_KEY_ID }}'
                  WASABI_SECRET_ACCESS_KEY: '${{ secrets.WASABI_SECRET_ACCESS_KEY }}'
                  WASABI_REGION: '${{ secrets.WASABI_REGION }}'
                  WASABI_SERVICE_URL: '${{ secrets.WASABI_SERVICE_URL }}'
                  WASABI_S3_BUCKET: '${{ secrets.WASABI_S3_BUCKET }}'
                  EXPRESS_SESSION_SECRET: '${{ secrets.EXPRESS_SESSION_SECRET }}'
                  JWT_SECRET: '${{ secrets.JWT_SECRET }}'
                  EVER_ID_ISSUER_URL: '${{ vars.EVER_ID_ISSUER_URL }}'
                  EVER_ID_AUDIENCE: '${{ vars.EVER_ID_AUDIENCE }}'
                  JWT_REFRESH_TOKEN_SECRET: '${{ secrets.JWT_REFRESH_TOKEN_SECRET }}'
                  JWT_REFRESH_TOKEN_EXPIRATION_TIME: '${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION_TIME }}'
                  MAIL_FROM_ADDRESS: '${{ secrets.MAIL_FROM_ADDRESS }}'
                  MAIL_HOST: '${{ secrets.MAIL_HOST }}'
                  MAIL_PORT: '${{ secrets.MAIL_PORT }}'
                  MAIL_USERNAME: '${{ secrets.MAIL_USERNAME }}'
                  MAIL_PASSWORD: '${{ secrets.MAIL_PASSWORD }}'
                  UPWORK_CALLBACK_URL: '${{ secrets.UPWORK_CALLBACK_URL }}'
                  FILE_PROVIDER: '${{ secrets.FILE_PROVIDER }}'
                  UNLEASH_APP_NAME: '${{ secrets.UNLEASH_APP_NAME }}'
                  UNLEASH_API_URL: '${{ secrets.UNLEASH_API_URL }}'
                  UNLEASH_INSTANCE_ID: '${{ secrets.UNLEASH_INSTANCE_ID }}'
                  UNLEASH_REFRESH_INTERVAL: '${{ secrets.UNLEASH_REFRESH_INTERVAL }}'
                  UNLEASH_METRICS_INTERVAL: '${{ secrets.UNLEASH_METRICS_INTERVAL }}'
                  UNLEASH_API_KEY: '${{ secrets.UNLEASH_API_KEY }}'
                  KEYMETRICS_MACHINE_NAME: '${{ secrets.KEYMETRICS_MACHINE_NAME }}'
                  KEYMETRICS_SECRET_KEY: '${{ secrets.KEYMETRICS_SECRET_KEY }}'
                  KEYMETRICS_PUBLIC_KEY: '${{ secrets.KEYMETRICS_PUBLIC_KEY }}'
                  OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY }}'
                  OPENAI_ORGANIZATION_ID: '${{ secrets.OPENAI_ORGANIZATION_ID }}'
                  OPENAI_MODEL: '${{ vars.OPENAI_MODEL }}'
                  OPENAI_API_KEY_CURRENT: '${{ secrets.OPENAI_API_KEY_CURRENT }}'
                  OPENAI_ORGANIZATION_ID_CURRENT: '${{ secrets.OPENAI_ORGANIZATION_ID_CURRENT }}'
                  OPENAI_MODEL_CURRENT: '${{ vars.OPENAI_MODEL_CURRENT }}'
                  IS_DISABLE_AUTH: 'true'

            # we need this step because for now we just use :latest tag
            # note: for production we will use different strategy later
            - name: Restart Pods to pick up :latest tag version
              run: |
                  kubectl --context do-sfo2-k8s-gauzy rollout restart deployment/gauzy-ai-dev-api

            # Supertokens was retired (Ever ID is the identity provider); `kubectl apply` does not prune,
            # so the old resources are deleted explicitly. Safe to repeat on a cluster that never had them.
            - name: Remove the retired Supertokens auth resources
              run: |
                  kubectl --context do-sfo2-k8s-gauzy delete --ignore-not-found deployment/gauzy-ai-dev-auth service/gauzy-ai-dev-auth-lb ingress/gauzy-ai-dev-auth-ingress
