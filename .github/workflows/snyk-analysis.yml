name: 'Snyk'

on:
    push:
        branches: [develop, stage, master]
    pull_request:
        # The branches below must be a subset of the branches above
        branches: [develop, stage, master]

concurrency:
    group: ${{ github.ref }}-${{ github.workflow }}
    cancel-in-progress: true

jobs:
    analyze:
        name: Analyze
        # the SARIF upload needs code scanning (a public repository or GitHub Advanced Security)
        if: ${{ !github.event.repository.private }}
        runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # secrets are not readable in a job-level `if`: decide in a step
            - name: Check for a Snyk token
              id: snyk
              run: echo "enabled=${{ secrets.SNYK_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

            - name: Run Snyk to check for vulnerabilities
              if: steps.snyk.outputs.enabled == 'true'
              uses: snyk/actions/node@master
              continue-on-error: true # To make sure that SARIF upload gets called
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  args: --sarif-file-output=snyk.sarif

            - name: Upload result to GitHub Code Scanning
              if: steps.snyk.outputs.enabled == 'true'
              uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: snyk.sarif
