name: Build and Publish Docker Images Stage

on:
    push:
        branches: [stage]

concurrency:
    group: ${{ github.ref }}-${{ github.workflow }}
    cancel-in-progress: true

jobs:
    gauzy-ai-api:
        runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Free disk space
              if: runner.environment == 'github-hosted'
              run: |
                  df -h /
                  sudo swapoff -a
                  sudo apt clean
                  docker image ls -aq
                  if [ "$(docker image ls -aq)" ]; then
                    docker rmi $(docker image ls -aq)
                  fi
                  find ~/work/_temp -name "cache.tgz" -exec rm -f {} \;
                  sudo rm -rf "/usr/local/share/boost"
                  sudo rm -rf "$AGENT_TOOLSDIRECTORY"
                  df -h /
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to DockerHub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GH_TOKEN }}

            - name: Install doctl
              if: ${{ vars.DO_ENABLED == 'true' }}
              uses: digitalocean/action-doctl@v2
              with:
                  token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

            - name: Log in to DigitalOcean Container Registry with short-lived credentials
              if: ${{ vars.DO_ENABLED == 'true' }}
              run: doctl registry login --expiry-seconds 3600

            - name: Build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./.deploy/api/Dockerfile
                  push: true
                  provenance: false
                  platforms: linux/amd64
                  tags: ghcr.io/ever-co/gauzy-ai-api-stage:latest
                  cache-from: type=registry,ref=ghcr.io/ever-co/gauzy-ai-api-stage:latest
                  cache-to: type=inline
                  build-args: |
                      NODE_ENV=development

            # cspell:ignore imagetools buildkit
            # The image is pushed by the build step itself (no `load` into the docker daemon: the runner's

            # 24 GiB docker volume ran out of space holding the buildkit store plus the loaded image). The

            # DigitalOcean copy is a manifest copy, no local image needed.

            - name: Copy to DigitalOcean Registry

              if: ${{ vars.DO_ENABLED == 'true' }}

              run: |

                  docker buildx imagetools create --prefer-index=false -t registry.digitalocean.com/ever/gauzy-ai-api-stage:latest ghcr.io/ever-co/gauzy-ai-api-stage:latest
